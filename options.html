<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prompt Enhancer — Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; font-family: monospace; }
    button { margin-top: 10px; padding: 8px 16px; }
    #status { margin-top: 10px; min-height: 1.2em; }
    .ok { color: green; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>Prompt Enhancer</h1>
  <label for="apiKey">Groq API key</label>
  <!-- type="password" hides the key from anyone looking at your screen -->
  <input id="apiKey" type="password" placeholder="gsk_..." autocomplete="off">
  <label><input id="showKey" type="checkbox" style="width:auto"> Show key</label>
  <br>
  <button id="save">Save</button>
  <div id="status"></div>
  <p><small>Stored only in this browser (chrome.storage.local). Never sent anywhere except Groq.</small></p>

  <!-- MV3 blocks inline scripts, so the logic lives in a separate file -->
  <script src="options.js"></script>
</body>
</html>
