<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prompt Enhancer — Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; line-height: 1.45; }
    h1 { display: flex; align-items: center; gap: 10px; }
    h1 img { width: 36px; height: 36px; border-radius: 8px; }
    .steps { background: #f4f4f6; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
    .steps h2 { font-size: 15px; margin: 0 0 6px; }
    .steps ol { margin: 0; padding-left: 20px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; font-family: monospace; }
    button { margin-top: 10px; padding: 8px 16px; }
    #status { margin-top: 10px; min-height: 1.2em; }
    .ok { color: green; }
    .error { color: #c00; }
    @media (prefers-color-scheme: dark) {
      body { background: #1f1f1f; color: #eee; }
      .steps { background: #2c2c2c; }
      a { color: #8ab4ff; }
      .ok { color: #5fd38d; }
      .error { color: #ff6b6b; }
    }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="">Prompt Enhancer</h1>

  <!-- First-time users land here on install; nothing works until a key is saved -->
  <div class="steps">
    <h2>Get your free Groq API key (1 minute)</h2>
    <ol>
      <li>Go to <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a> and sign in (free).</li>
      <li>Click <b>Create API Key</b> and copy it.</li>
      <li>Paste it below and click <b>Save</b>.</li>
    </ol>
  </div>

  <label for="apiKey">Groq API key</label>
  <!-- type="password" hides the key from anyone looking at your screen -->
  <input id="apiKey" type="password" placeholder="gsk_..." autocomplete="off">
  <label><input id="showKey" type="checkbox" style="width:auto"> Show key</label>
  <br>
  <button id="save">Save</button>
  <div id="status"></div>
  <p><small>Stored only in this browser (chrome.storage.local). Never sent anywhere except Groq.</small></p>

  <!-- MV3 blocks inline scripts, so the logic lives in a separate file -->
  <script src="options.js"></script>
</body>
</html>
